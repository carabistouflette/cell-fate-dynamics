[project]
name = "cell-fate-dynamics"
version = "0.1.0"
description = "A reproducible exploration of cell-state transitions and latent representations in scRNA-seq data."
readme = "README.md"
authors = [
    { name = "carabistouflette", email = "nek0@tutanota.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cellrank>=2.0.7",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.0.0",
    "matplotlib>=3.11.2",
    "numpy<2",
    "scanpy>=1.11.5",
    "scvelo>=0.3.4",
    "scvi-tools>=1.4.2",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipywidgets>=8.1.9",
    "nbclient>=0.11.0",
    "pytest>=9.2.0",
]
